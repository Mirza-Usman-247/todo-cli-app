# Fluent Bit Helm Values for OKE (T120, T121)
# Configured to collect logs and send to OCI Logging or Loki

image:
  repository: fluent/fluent-bit
  tag: 2.2.0

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# DaemonSet configuration (runs on every node)
kind: DaemonSet

# Service account
serviceAccount:
  create: true
  annotations: {}

# Configuration
config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File parsers.conf
        Parsers_File custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/todo-app*.log
        Parser docker
        Tag kube.todo-app.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
        Refresh_Interval 10

    [INPUT]
        Name tail
        Path /var/log/containers/*daprd*.log
        Parser docker
        Tag kube.dapr.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
        Refresh_Interval 10

    [INPUT]
        Name systemd
        Tag host.*
        Systemd_Filter _SYSTEMD_UNIT=kubelet.service
        Read_From_Tail On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_URL https://kubernetes.default.svc:443
        Kube_CA_File /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
        Labels On
        Annotations On

    [FILTER]
        Name modify
        Match kube.todo-app.*
        Add app todo-app
        Add environment production

    [FILTER]
        Name modify
        Match kube.dapr.*
        Add component dapr
        Add environment production

    [FILTER]
        Name grep
        Match kube.*
        Exclude log health

  outputs: |
    # Output to Loki (if deployed)
    [OUTPUT]
        Name loki
        Match kube.*
        Host loki
        Port 3100
        Labels job=fluentbit, app=$app, component=$component
        Auto_Kubernetes_Labels on

    # Output to stdout for debugging
    [OUTPUT]
        Name stdout
        Match kube.todo-app.*
        Format json_lines

    # Output to OCI Logging (configure with OCI credentials)
    # [OUTPUT]
    #     Name oci
    #     Match kube.*
    #     oci_config_file /etc/fluent-bit/oci-config
    #     oci_la_log_group_id <log-group-ocid>
    #     oci_la_log_set_id <log-set-ocid>

  customParsers: |
    [PARSER]
        Name docker
        Format json
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep On

    [PARSER]
        Name fastapi
        Format regex
        Regex ^(?<time>[^ ]+) - (?<level>[^ ]+) - (?<message>.*)$
        Time_Key time
        Time_Format %Y-%m-%d %H:%M:%S,%L

# Tolerations (to run on all nodes)
tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Volume mounts
volumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true

volumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
