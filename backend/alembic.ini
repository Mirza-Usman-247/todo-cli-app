# Alembic Configuration File

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with this value
prepend_sys_path = .

# Timezone for revision timestamps (UTC recommended for consistency)
timezone = UTC

# Max length of characters for slug
truncate_slug_length = 40

# Emit SQL during 'revision' rather than actually execute
# sqlalchemy.url from env.py is used instead
# sqlalchemy.url = driver://user:pass@localhost/dbname

# Version table name
version_table = alembic_version

[post_write_hooks]
# Post write hooks for formatting

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
