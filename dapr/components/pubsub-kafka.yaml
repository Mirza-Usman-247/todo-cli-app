apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub-kafka
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
    - name: consumerGroup
      value: "backend-group"
    - name: clientId
      value: "todo-backend"
    - name: authType
      value: "none"
    - name: maxMessageBytes
      value: "1048576"
