{{- if .Values.backend.dapr.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore-redis
  namespace: {{ .Release.Namespace }}
spec:
  type: state.redis
  version: v1
  metadata:
  {{- range .Values.dapr.components }}
  {{- if eq .name "statestore-redis" }}
  {{- range .metadata }}
  - name: {{ .name }}
    value: {{ .value | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
