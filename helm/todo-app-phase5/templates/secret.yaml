apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: {{ .Release.Name }}
    release: {{ .Release.Name }}
type: Opaque
data:
  # Placeholder secrets - should be overridden with actual values
  # All values must be base64 encoded
  # Example: echo -n "your-secret-value" | base64

  # Database credentials (if needed for Phase 2-4)
  db-password: {{ "postgres" | b64enc | quote }}

  # API keys (if needed)
  # openai-api-key: {{ "your-key-here" | b64enc | quote }}
