apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-secret
  namespace: {{ .Values.global.namespace | default "todo-app" }}
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.jwtSecret }}
  jwtSecret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- else }}
  jwtSecret: {{ include "todo-chatbot.generateSecret" . | quote }}
  {{- end }}
  {{- if .Values.secrets.betterAuthSecret }}
  betterAuthSecret: {{ .Values.secrets.betterAuthSecret | b64enc | quote }}
  {{- else }}
  betterAuthSecret: {{ include "todo-chatbot.generateSecret" . | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  databaseUrl: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- else }}
  databaseUrl: {{ "" | b64enc | quote }}
  {{- end }}
