# Frontend Deployment Contract Specification
# Phase IV — Local Kubernetes Deployment
# Component: todo-chatbot-frontend
# Date: 2026-01-21

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-frontend
  namespace: {{ .Values.global.namespace | default "todo-app" }}
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "todo-chatbot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1           # Allow 1 extra pod during update
      maxUnavailable: 0     # Ensure at least 1 pod always running

  template:
    metadata:
      labels:
        {{- include "todo-chatbot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Force pod restart on config changes

    spec:
      # Security context for pod
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.frontend.securityContext.runAsUser | default 1000 }}
        fsGroup: {{ .Values.frontend.securityContext.fsGroup | default 1000 }}

      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default "IfNotPresent" }}

        ports:
        - name: http
          containerPort: {{ .Values.frontend.service.targetPort | default 3000 }}
          protocol: TCP

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: {{ include "todo-chatbot.fullname" . }}-config

        # Environment variables from Secret (if needed)
        # env:
        # - name: EXAMPLE_SECRET
        #   valueFrom:
        #     secretKeyRef:
        #       name: {{ include "todo-chatbot.fullname" . }}-secret
        #       key: exampleSecret

        # Resource requests and limits
        resources:
          requests:
            cpu: {{ .Values.frontend.resources.requests.cpu | quote }}
            memory: {{ .Values.frontend.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.frontend.resources.limits.cpu | quote }}
            memory: {{ .Values.frontend.resources.limits.memory | quote }}

        # Liveness probe (restart container if failing)
        {{- if .Values.frontend.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.frontend.livenessProbe.httpGet.path | default "/health" }}
            port: {{ .Values.frontend.livenessProbe.httpGet.port | default 3000 }}
            scheme: HTTP
          initialDelaySeconds: {{ .Values.frontend.livenessProbe.initialDelaySeconds | default 30 }}
          periodSeconds: {{ .Values.frontend.livenessProbe.periodSeconds | default 10 }}
          timeoutSeconds: {{ .Values.frontend.livenessProbe.timeoutSeconds | default 5 }}
          failureThreshold: {{ .Values.frontend.livenessProbe.failureThreshold | default 3 }}
          successThreshold: 1
        {{- end }}

        # Readiness probe (remove from service if failing)
        {{- if .Values.frontend.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.frontend.readinessProbe.httpGet.path | default "/health" }}
            port: {{ .Values.frontend.readinessProbe.httpGet.port | default 3000 }}
            scheme: HTTP
          initialDelaySeconds: {{ .Values.frontend.readinessProbe.initialDelaySeconds | default 10 }}
          periodSeconds: {{ .Values.frontend.readinessProbe.periodSeconds | default 5 }}
          timeoutSeconds: {{ .Values.frontend.readinessProbe.timeoutSeconds | default 3 }}
          failureThreshold: {{ .Values.frontend.readinessProbe.failureThreshold | default 2 }}
          successThreshold: 1
        {{- end }}

      # Restart policy
      restartPolicy: Always

      # Termination grace period
      terminationGracePeriodSeconds: 30

---
# Service for Frontend
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-frontend
  namespace: {{ .Values.global.namespace | default "todo-app" }}
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type | default "LoadBalancer" }}
  selector:
    {{- include "todo-chatbot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend

  ports:
  - name: http
    protocol: TCP
    port: {{ .Values.frontend.service.port | default 80 }}        # External service port
    targetPort: {{ .Values.frontend.service.targetPort | default 3000 }}  # Container port

  # Session affinity (optional, for sticky sessions)
  sessionAffinity: None

---
# Contract Validation Specifications

contractValidation:
  deployment:
    required:
      - metadata.name matches pattern: <release-name>-frontend
      - metadata.namespace = "todo-app"
      - spec.replicas >= 1
      - spec.strategy.type = "RollingUpdate"
      - spec.template.spec.securityContext.runAsNonRoot = true
      - spec.template.spec.containers[0].name = "frontend"
      - spec.template.spec.containers[0].image includes "todo-chatbot-frontend"
      - spec.template.spec.containers[0].ports[0].containerPort = 3000
      - spec.template.spec.containers[0].resources.requests.cpu is defined
      - spec.template.spec.containers[0].resources.requests.memory is defined
      - spec.template.spec.containers[0].resources.limits.cpu is defined
      - spec.template.spec.containers[0].resources.limits.memory is defined
      - spec.template.spec.containers[0].livenessProbe is defined
      - spec.template.spec.containers[0].readinessProbe is defined

  service:
    required:
      - metadata.name matches pattern: <release-name>-frontend
      - metadata.namespace = "todo-app"
      - spec.type = "LoadBalancer"
      - spec.selector matches deployment labels
      - spec.ports[0].port = 80
      - spec.ports[0].targetPort = 3000

  healthChecks:
    liveness:
      path: /health
      port: 3000
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      path: /health
      port: 3000
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 2

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

---
# Test Cases

testCases:
  - name: "Frontend Deployment Creation"
    command: "kubectl get deployment todo-chatbot-frontend -n todo-app"
    expectedOutput: "todo-chatbot-frontend   1/1     1            1"
    description: "Verify deployment is created and ready"

  - name: "Frontend Pods Running"
    command: "kubectl get pods -n todo-app -l app.kubernetes.io/component=frontend"
    expectedOutput: "Running"
    description: "Verify all frontend pods are in Running state"

  - name: "Frontend Service Exposed"
    command: "kubectl get svc todo-chatbot-frontend -n todo-app"
    expectedOutput: "LoadBalancer"
    description: "Verify LoadBalancer service is created"

  - name: "Frontend Health Check Passing"
    command: "kubectl exec -it <frontend-pod> -n todo-app -- curl -f http://localhost:3000/health"
    expectedOutput: "HTTP 200"
    description: "Verify health endpoint responds successfully"

  - name: "Frontend Resource Limits Enforced"
    command: "kubectl describe pod <frontend-pod> -n todo-app | grep -A 5 'Limits'"
    expectedOutput: |
      cpu:     200m
      memory:  256Mi
    description: "Verify resource limits are applied to pod"

  - name: "Frontend Accessible via LoadBalancer"
    command: "curl -f http://localhost:3000"
    expectedOutput: "HTTP 200"
    description: "Verify frontend is accessible via Minikube tunnel"

---
# Acceptance Criteria (from spec.md)

acceptanceCriteria:
  - id: FR-001
    requirement: "Frontend container image built with multi-stage build"
    validation: "docker images | grep todo-chatbot-frontend"

  - id: FR-004
    requirement: "Frontend Deployment manifest with health checks and resource limits"
    validation: "kubectl get deployment todo-chatbot-frontend -n todo-app -o yaml"

  - id: FR-005
    requirement: "Frontend Service manifest with LoadBalancer type"
    validation: "kubectl get svc todo-chatbot-frontend -n todo-app -o yaml"

  - id: FR-008
    requirement: "Frontend resource requests/limits: 100m/128Mi → 200m/256Mi"
    validation: "kubectl describe deployment todo-chatbot-frontend -n todo-app"

  - id: FR-010
    requirement: "Frontend pods reach Running state with 0 restarts"
    validation: "kubectl get pods -n todo-app -l app.kubernetes.io/component=frontend"

  - id: SC-004
    requirement: "Frontend accessible at http://localhost:3000 within 30s"
    validation: "curl -f http://localhost:3000 (after minikube tunnel)"

---
# Troubleshooting Guide

troubleshooting:
  - issue: "Pods stuck in Pending state"
    cause: "Insufficient cluster resources or scheduling issues"
    resolution: |
      1. Check Minikube resource allocation: minikube config view
      2. Increase resources: minikube config set cpus 4 && minikube config set memory 8192
      3. Restart Minikube: minikube stop && minikube start

  - issue: "Pods in CrashLoopBackOff state"
    cause: "Application startup failure or missing environment variables"
    resolution: |
      1. Check pod logs: kubectl logs <pod-name> -n todo-app
      2. Verify ConfigMap: kubectl get configmap todo-chatbot-config -n todo-app -o yaml
      3. Check health endpoint: kubectl exec -it <pod-name> -n todo-app -- curl http://localhost:3000/health

  - issue: "ImagePullBackOff error"
    cause: "Container image not found in Minikube registry"
    resolution: |
      1. Ensure Docker env set: eval $(minikube docker-env)
      2. Rebuild image: docker build -t todo-chatbot-frontend:latest ./docker/frontend
      3. Verify image: docker images | grep todo-chatbot-frontend

  - issue: "LoadBalancer service has no external IP"
    cause: "Minikube tunnel not running"
    resolution: |
      1. Start tunnel: minikube tunnel (requires sudo on some systems)
      2. Verify external IP: kubectl get svc todo-chatbot-frontend -n todo-app
      3. Access at: http://localhost:3000

  - issue: "OOMKilled events in pod logs"
    cause: "Memory limit too low for application"
    resolution: |
      1. Increase memory limits in values.yaml: frontend.resources.limits.memory = "512Mi"
      2. Upgrade Helm release: helm upgrade todo-chatbot ./helm/todo-chatbot -n todo-app
      3. Monitor usage: kubectl top pod <pod-name> -n todo-app
