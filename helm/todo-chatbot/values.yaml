# Default values for todo-chatbot Helm chart
# Phase IV — Local Kubernetes Deployment

global:
  namespace: todo-app

# Frontend configuration
frontend:
  replicas: 1

  image:
    repository: todo-chatbot-frontend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: LoadBalancer
    port: 80
    targetPort: 3000

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

  livenessProbe:
    enabled: false
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: false
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

  securityContext:
    runAsUser: 1000
    fsGroup: 1000

# Backend configuration
backend:
  replicas: 1

  image:
    repository: todo-chatbot-backend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: LoadBalancer
    port: 80
    targetPort: 8000

  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  livenessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

  securityContext:
    runAsUser: 1001
    fsGroup: 1001

# ConfigMap data (non-sensitive configuration)
config:
  PORT: "8000"
  NODE_ENV: "development"
  VITE_API_URL: "http://localhost:8000/api"

# Secrets (sensitive data - auto-generated if not provided)
secrets:
  # Leave empty to auto-generate random 32-character values
  jwtSecret: ""
  betterAuthSecret: ""
  databaseUrl: ""  # Empty for Phase IV (no database)
