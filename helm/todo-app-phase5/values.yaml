# Helm values for Todo App Phase 2-5
# This deploys your existing app WITH Phase 5 event-driven features

backend:
  image:
    repository: todo-backend
    tag: phase5
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  # Phase 5: Dapr sidecar configuration
  dapr:
    enabled: true
    appId: "backend"
    appPort: 8000
    logLevel: "info"

  # Autoscaling configuration
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  # Existing Phase 2-4 configuration
  env:
    - name: DATABASE_URL
      value: "postgresql://postgres:postgres@postgres:5432/todos"
    - name: FRONTEND_URL
      value: "http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:30000,http://127.0.0.1:40835,http://localhost:40835"
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: gemini-secret
          key: api-key
          optional: false
    - name: OPENAI_BASE_URL
      value: "https://generativelanguage.googleapis.com/v1beta/openai/"
    - name: MODEL_ID
      value: "gemini-2.0-flash-exp"

frontend:
  image:
    repository: todo-frontend
    tag: phase5
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # Autoscaling configuration
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

# Phase 2-4: PostgreSQL (existing)
postgresql:
  enabled: true
  auth:
    database: todos
    username: postgres
    password: postgres
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Phase 5: Dapr components
dapr:
  components:
    - name: pubsub-kafka
      type: pubsub.kafka
      version: v1
      metadata:
        - name: brokers
          value: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
        - name: consumerGroup
          value: "backend-group"
        - name: authType
          value: "none"

    - name: statestore-redis
      type: state.redis
      version: v1
      metadata:
        - name: redisHost
          value: "redis-master:6379"
        - name: enableTLS
          value: "false"

    - name: kubernetes-secrets
      type: secretstores.kubernetes
      version: v1

# Service configuration
service:
  backend:
    type: ClusterIP
    port: 8000
  frontend:
    type: NodePort
    port: 3000
    nodePort: 30000

# Pod Disruption Budget configuration
podDisruptionBudget:
  backend:
    enabled: false
    minAvailable: 1
  frontend:
    enabled: false
    minAvailable: 1

# Horizontal Pod Autoscaler configuration
hpa:
  backend:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

# Monitoring configuration
monitoring:
  enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false
