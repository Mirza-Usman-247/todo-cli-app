apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-chatbot.fullname" . }}-backend
  namespace: {{ .Values.global.namespace | default "todo-app" }}
  labels:
    {{- include "todo-chatbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type | default "LoadBalancer" }}
  selector:
    {{- include "todo-chatbot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend

  ports:
  - name: http
    protocol: TCP
    port: {{ .Values.backend.service.port | default 80 }}
    targetPort: {{ .Values.backend.service.targetPort | default 8000 }}

  sessionAffinity: None
