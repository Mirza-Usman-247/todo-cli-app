[project]
name = "todo-api"
version = "0.1.0"
description = "Phase 2 Todo Web Application Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.1.0",
    "openai>=1.0.0",
    "mcp>=0.5.0",
    "dapr>=1.13.0",
    "dapr-ext-fastapi>=1.13.0",
    "jsonschema>=4.20.0",
]  # Phase 2-5: Auth, Chat, AI, Event-Driven (Dapr SDK for Phase 5)

# Note: Install with: uv pip install -e . ".[dev]" or pip install -e ".[dev]"

# Optional dependencies for development
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=4.1.0",
]  # Development tools - install with: uv pip install -e . .[dev] or pip install -e ".[dev]"

# Build system configuration
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]

# Hatch build configuration
[tool.hatch.build.targets.wheel]
packages = ["src"]  # Include all packages under src/ directory in wheel build

# NOTE: This is the end of the file - do not add duplicate sections below
# All configuration sections above are complete and unique (no duplicates)
# If you add new optional dependencies, use the existing [project.optional-dependencies] section at line 25

